# CI/CD Pipeline for r8s
# S4-CRITICAL-1: Automated testing and quality gates
#
# Features:
# - Build verification on every push/PR
# - Test execution with race detection
# - Coverage reporting (50% minimum)
# - Cross-platform build checks
# - Artifact upload for coverage reports
#
# Triggers: Push to main/sprint4, PRs to main/sprint4

name: CI

on:
  push:
    branches:
      - main
      - sprint4
  pull_request:
    branches:
      - main
      - sprint4

env:
  GO_VERSION: '1.24'
  MIN_COVERAGE: '50'

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis
    
    # Setup Go
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    
    # Verify Go version
    - name: Verify Go installation
      run: |
        go version
        which go
    
    # Cache Go modules
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    # Download dependencies
    - name: Download dependencies
      run: go mod download
    
    # Build the application
    - name: Build r8s
      run: make build
    
    # Verify binary was created
    - name: Verify binary
      run: |
        ls -lh bin/r8s
        ./bin/r8s version
    
    # Run tests with race detection
    - name: Run tests
      run: make test
    
    # Generate coverage report
    - name: Generate coverage report
      run: make coverage
    
    # Check minimum coverage threshold
    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"
        echo "Minimum required: ${{ env.MIN_COVERAGE }}%"
        if (( $(echo "$COVERAGE < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
          echo "ERROR: Coverage ${COVERAGE}% is below minimum ${{ env.MIN_COVERAGE }}%"
          exit 1
        fi
        echo "✓ Coverage check passed"
    
    # Upload coverage report as artifact
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ github.sha }}
        path: |
          coverage.out
          coverage.html
        retention-days: 30
    
    # Upload coverage to GitHub summary
    - name: Coverage summary
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "- Total Coverage: **${COVERAGE}**" >> $GITHUB_STEP_SUMMARY
        echo "- Minimum Required: **${{ env.MIN_COVERAGE }}%**" >> $GITHUB_STEP_SUMMARY
        echo "- Status: ✓ PASS" >> $GITHUB_STEP_SUMMARY

  # Job 2: Lint checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    # Install golangci-lint
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m --out-format=github-actions
        skip-cache: false

  # Job 3: Cross-platform build verification
  cross-platform:
    name: Cross-Platform Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Build for ${{ matrix.os }}/${{ matrix.arch }}
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        OUTPUT="bin/r8s-${{ matrix.os }}-${{ matrix.arch }}"
        if [ "${{ matrix.os }}" = "windows" ]; then
          OUTPUT="${OUTPUT}.exe"
        fi
        go build -ldflags "-X main.version=ci-test -X main.date=$(date -u +%Y-%m-%d)" -o "$OUTPUT" main.go
        ls -lh "$OUTPUT"

  # Job 4: Integration test
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Build r8s
      run: make build
    
    - name: Test CLI help
      run: |
        ./bin/r8s --help
        ./bin/r8s version
        ./bin/r8s test-cluster --help || true  # May fail without bundle, that's ok
    
    - name: Test with demo bundle
      run: |
        # Run with embedded demo bundle (no args)
        timeout 5 ./bin/r8s --help || true

  # Job 5: Documentation check
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Check documentation files exist
      run: |
        REQUIRED_DOCS="README.md ROADMAP_UPDATES.md CHANGELOG.md CONTRIBUTING.md"
        MISSING=0
        for doc in $REQUIRED_DOCS; do
          if [ ! -f "$doc" ]; then
            echo "MISSING: $doc"
            MISSING=$((MISSING + 1))
          else
            echo "✓ $doc"
          fi
        done
        if [ $MISSING -gt 0 ]; then
          echo "ERROR: $MISSING required documentation files missing"
          exit 1
        fi
        echo "All required documentation present"
    
    - name: Check markdown links (basic)
      run: |
        # Simple check for broken internal links
        if grep -r "\[.*\](\s*)" --include="*.md" .; then
          echo "WARNING: Found empty markdown links"
        fi
        echo "Basic markdown check complete"
