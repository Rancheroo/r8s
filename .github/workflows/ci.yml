# CI/CD Pipeline for r8s
# Simplified: Build verification only (tests run locally)
# See ROADMAP_UPDATES.md for CI/CD review task

name: CI

on:
  push:
    branches:
      - main
      - sprint4
      - 'feature/**'
  pull_request:
    branches:
      - main
      - sprint4
      - 'feature/**'

env:
  GO_VERSION: '1.23'

jobs:
  # Job 1: Build and Verify
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    
    - name: Download dependencies
      run: go mod download
    
    - name: Build r8s
      run: make build
    
    - name: Verify binary
      run: |
        ls -lh bin/r8s
        ./bin/r8s version
        ./bin/r8s --help

  # Job 2: Cross-platform builds
  cross-platform:
    name: Cross-Platform Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Build for ${{ matrix.os }}/${{ matrix.arch }}
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        OUTPUT="bin/r8s-${{ matrix.os }}-${{ matrix.arch }}"
        go build -ldflags "-X main.version=ci-test -X main.date=$(date -u +%Y-%m-%d)" -o "$OUTPUT" main.go
        ls -lh "$OUTPUT"

  # Job 3: Documentation check
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Check documentation
      run: |
        test -f README.md && echo "✓ README.md"
        test -f ROADMAP_UPDATES.md && echo "✓ ROADMAP_UPDATES.md"
        echo "Documentation check complete"
