# CI/CD Pipeline for r8s
# S4-CRITICAL-1: Automated testing and quality gates
#
# Features:
# - Build verification on every push/PR
# - Test execution with race detection
# - Coverage reporting (50% minimum)
# - Cross-platform build checks
# - Artifact upload for coverage reports
#
# Triggers: Push to main/sprint4, PRs to main/sprint4

name: CI

on:
  push:
    branches:
      - main
      - sprint4
  pull_request:
    branches:
      - main
      - sprint4

env:
  GO_VERSION: '1.23'
  MIN_COVERAGE: '15' # Raised from 5% - Sprint 5 pipeline hardening

jobs:
  # Job 0: Pre-merge guards (fast fail)
  pre-merge-guards:
    name: Pre-Merge Guards
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for diff
    
    - name: Check file count
      run: |
        # Count files changed in this PR
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        else
          BASE_SHA="origin/main"
          HEAD_SHA="HEAD"
        fi
        
        FILE_COUNT=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | wc -l)
        echo "Files changed: $FILE_COUNT"
        echo "Limit: 150"
        
        if [ "$FILE_COUNT" -gt 150 ]; then
          echo "ERROR: Too many files changed ($FILE_COUNT > 150)"
          echo "Split this PR into smaller chunks for easier review"
          exit 1
        fi
        echo "✓ File count check passed"
    
    - name: Check for example-log-bundle files
      run: |
        # Check if any example-log-bundle files were modified
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        else
          BASE_SHA="origin/main"
          HEAD_SHA="HEAD"
        fi
        
        BUNDLE_FILES=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -c "example-log-bundle" || true)
        
        if [ "$BUNDLE_FILES" -gt 0 ]; then
          echo "ERROR: Found example-log-bundle files in PR"
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep "example-log-bundle"
          echo "Log bundles should not be committed to the repo"
          exit 1
        fi
        echo "✓ No log bundle files detected"
    
    - name: Check for large/binary files
      run: |
        # Check for files > 1MB (likely binaries accidentally committed)
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        else
          BASE_SHA="origin/main"
          HEAD_SHA="HEAD"
        fi
        
        LARGE_FILES=$(git diff --stat "$BASE_SHA"..."$HEAD_SHA" | awk '$4 > 1024 {print $1}' | grep -v "|" || true)
        
        if [ -n "$LARGE_FILES" ]; then
          echo "WARNING: Large files detected (>1MB):"
          echo "$LARGE_FILES"
          echo "Ensure these are intentional (e.g., test fixtures)"
        fi
        echo "✓ Large file check complete"

  # Job 1: Build and Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: pre-merge-guards  # Don't run if guards fail
    
    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis
    
    # Setup Go
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    
    # Verify Go version
    - name: Verify Go installation
      run: |
        go version
        which go
    
    # Cache Go modules
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    # Download dependencies
    - name: Download dependencies
      run: go mod download
    
    # Build the application
    - name: Build r8s
      run: make build
    
    # Verify binary was created
    - name: Verify binary
      run: |
        ls -lh bin/r8s
        ./bin/r8s version
    
    # Run tests with race detection
    - name: Run tests
      run: make test
    
    # Generate coverage report
    - name: Generate coverage report
      run: make coverage
    
    # Check minimum coverage threshold
    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"
        echo "Minimum required: ${{ env.MIN_COVERAGE }}%"
        if (( $(echo "$COVERAGE < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
          echo "ERROR: Coverage ${COVERAGE}% is below minimum ${{ env.MIN_COVERAGE }}%"
          exit 1
        fi
        echo "✓ Coverage check passed"
    
    # Upload coverage report as artifact
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ github.sha }}
        path: |
          coverage.out
          coverage.html
        retention-days: 30
    
    # Upload coverage to GitHub summary
    - name: Coverage summary
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "- Total Coverage: **${COVERAGE}**" >> $GITHUB_STEP_SUMMARY
        echo "- Minimum Required: **${{ env.MIN_COVERAGE }}%**" >> $GITHUB_STEP_SUMMARY

  # Job 2: Lint checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    # Install golangci-lint
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m --out-format=github-actions
        skip-cache: false

  # Job 3: Cross-platform build verification
  cross-platform:
    name: Cross-Platform Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Build for ${{ matrix.os }}/${{ matrix.arch }}
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        OUTPUT="bin/r8s-${{ matrix.os }}-${{ matrix.arch }}"
        if [ "${{ matrix.os }}" = "windows" ]; then
          OUTPUT="${OUTPUT}.exe"
        fi
        go build -ldflags "-X main.version=ci-test -X main.date=$(date -u +%Y-%m-%d)" -o "$OUTPUT" main.go
        ls -lh "$OUTPUT"

  # Job 4: Integration test
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Build r8s
      run: make build
    
    - name: Test CLI help
      run: |
        ./bin/r8s --help
        ./bin/r8s version
        ./bin/r8s test-cluster --help
    
    - name: Test with demo bundle (smoke test)
      run: |
        # Create minimal test bundle structure
        mkdir -p /tmp/test-bundle/rke2/kubectl
        mkdir -p /tmp/test-bundle/systeminfo
        
        # Add minimal pod data
        echo "NAMESPACE NAME READY STATUS RESTARTS AGE" > /tmp/test-bundle/rke2/kubectl/pods
        echo "default test-pod 1/1 Running 0 5m" >> /tmp/test-bundle/rke2/kubectl/pods
        
        # Add minimal node data
        echo "NAME STATUS ROLES AGE VERSION" > /tmp/test-bundle/rke2/kubectl/nodes
        echo "node1 Ready control-plane 10d v1.24.0" >> /tmp/test-bundle/rke2/kubectl/nodes
        
        # Add minimal events data
        echo "NAMESPACE LAST SEEN TYPE REASON OBJECT MESSAGE" > /tmp/test-bundle/rke2/kubectl/events
        
        # Add dmesg
        echo "[    0.000000] Linux version 5.15" > /tmp/test-bundle/systeminfo/dmesg
        
        # Run test-cluster command (should complete without panic)
        ./bin/r8s test-cluster /tmp/test-bundle || true
        
        echo "✓ Smoke test completed (exit code may vary based on bundle content)"

  # Job 5: Documentation check
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Check documentation files exist
      run: |
        REQUIRED_DOCS="README.md ROADMAP_UPDATES.md CHANGELOG.md CONTRIBUTING.md"
        MISSING=0
        for doc in $REQUIRED_DOCS; do
          if [ ! -f "$doc" ]; then
            echo "MISSING: $doc"
            MISSING=$((MISSING + 1))
          else
            echo "✓ $doc"
          fi
        done
        if [ $MISSING -gt 0 ]; then
          echo "ERROR: $MISSING required documentation files missing"
          exit 1
        fi
        echo "All required documentation present"
    
    - name: Check markdown links (basic)
      run: |
        # Simple check for broken internal links
        if grep -r "\[.*\](\s*)" --include="*.md" .; then
          echo "WARNING: Found empty markdown links"
        fi
        echo "Basic markdown check complete"
